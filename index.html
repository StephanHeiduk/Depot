<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f9f9f7">
<!-- verhindert, dass der Browser eine alte Fassung aus dem Cache zeigt -->
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Strategie-Dashboard</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834;
  --good:#0ca30c; --good-text:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --s1-soft:rgba(42,120,214,.14); --s2-soft:rgba(235,104,52,.12);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-1:#1a1a19; --plane:#0d0d0d;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926;
    --good:#0ca30c; --good-text:#0ca30c;
    --s1-soft:rgba(57,135,229,.18); --s2-soft:rgba(217,89,38,.15);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926;
  --good:#0ca30c; --good-text:#0ca30c;
  --s1-soft:rgba(57,135,229,.18); --s2-soft:rgba(217,89,38,.15);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%;
  padding:0 0 48px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

header.top{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0}
.brand{font-weight:650;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0}
button.btn{
  font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface-1);color:var(--ink);
  cursor:pointer;white-space:nowrap;
}
button.btn:hover{border-color:var(--axis)}
button.btn[disabled]{opacity:.5;cursor:default}
.pricestate{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--good)}
.dot.stale{background:var(--warn)}

nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  font:inherit;font-size:14px;padding:8px 13px;border:0;background:none;color:var(--ink-2);
  border-radius:10px 10px 0 0;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;
}
nav.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--s1)}

section.tab{display:none;padding-top:20px}
section.tab.active{display:block}

.card{
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;margin-bottom:16px;
}
.card > h2{font-size:15px;margin:0 0 2px;font-weight:600;letter-spacing:-.01em}
.card > p.sub{margin:0 0 14px;font-size:12.5px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px}
.kpi .lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.kpi .val{font-size:24px;font-weight:640;letter-spacing:-.02em;margin-top:5px;line-height:1.15}
.kpi .val.sm{font-size:20px}
.kpi .delta{font-size:12.5px;margin-top:3px;color:var(--ink-2)}
.up{color:var(--good-text)} .down{color:var(--crit)}

.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--plane);border:1px solid var(--border);border-radius:999px;padding:2px}
.seg button{
  font:inherit;font-size:12.5px;padding:5px 11px;border:0;background:none;color:var(--ink-2);
  border-radius:999px;cursor:pointer;
}
.seg button[aria-pressed="true"]{background:var(--surface-1);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.spacer{margin-left:auto}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin:2px 0 8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

.chartbox{position:relative;width:100%}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.tip{
  position:absolute;pointer-events:none;z-index:5;opacity:0;transition:opacity .1s;
  background:var(--surface-1);border:1px solid var(--axis);border-radius:10px;
  padding:8px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.14);min-width:150px;
}
.tip .t-d{color:var(--muted);font-size:11.5px;margin-bottom:4px}
.tip .t-r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .t-r b{font-weight:600}

table{width:100%;border-collapse:collapse;font-size:13.5px}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
   position:sticky;top:0;background:var(--surface-1)}
th:first-child,td:first-child{text-align:left}
td.num,th.num{font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:2px solid var(--axis);border-bottom:0}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);color:var(--ink-2)}
.tag.buy{color:var(--s1);border-color:color-mix(in srgb,var(--s1) 40%,transparent)}
.tag.sell{color:var(--s2);border-color:color-mix(in srgb,var(--s2) 40%,transparent)}
.tag.div{color:var(--good-text);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.swatch{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px;vertical-align:0}

.issue{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--grid)}
.issue:last-child{border-bottom:0}
.issue .ico{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#fff}
.issue.error .ico{background:var(--crit)} .issue.warn .ico{background:var(--serious)}
.issue.info .ico{background:var(--muted)} .issue.ok .ico{background:var(--good)}
.issue .txt{font-size:13.5px}
.issue .files{font-size:11.5px;color:var(--muted);margin-top:2px}

.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.hint{background:var(--plane);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--ink-2)}
code{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--plane);padding:1px 5px;border-radius:5px}

@media (max-width:640px){
  .wrap{padding:0 11px}
  .kpi .val{font-size:21px}
  th,td{padding:8px 8px;font-size:13px}
  .card{padding:13px}
}
@media print{ nav.tabs,header.top button{display:none} section.tab{display:block!important} }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">

</header>

<div class="wrap">

  <section class="tab" id="tab-kosten"></section>
  <section class="tab" id="tab-pruefung"></section>
</div>

<script>

/* ------------------------------------------------------------ Formatierung */
const nfEur = new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"});

}
const daysBetween = (a,b) => Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);

/** Offene Kauftranchen je Wertpapier. Verkaeufe bauen sie nach FIFO ab -
 *  jede Tranche hat ihre eigene Frist, auch wenn dasselbe Papier in mehreren
 *  Monaten gekauft wurde. */
function openLots(){
  const lots={};
  for(const t of TRADES){
    const arr = lots[t.isin] || (lots[t.isin]=[]);
    if(t.side==="BUY"){
      arr.push({isin:t.isin, name:t.name, date:t.date, qty:t.quantity,
                cost:t.amount, fee:t.fee_total||0, file:t.source_file});
    }else{
      let rest=t.quantity;
      while(rest>1e-9 && arr.length){
        const l=arr[0], take=Math.min(l.qty, rest);
        l.cost -= l.cost*(take/l.qty); l.qty -= take; rest -= take;
        if(l.qty<=1e-9) arr.shift();
      }
    }
  }
  // Teilausfuehrungen desselben Kaufs zu einer Tranche zusammenfassen
  const merged={};
  for(const isin in lots) for(const l of lots[isin]){
    if(l.qty<=1e-9) continue;
    const key=isin+"|"+l.date;
    if(merged[key]){
      merged[key].qty += l.qty; merged[key].cost += l.cost;
      merged[key].fee += l.fee; merged[key].fills++;
    }else{
      merged[key]={...l, fills:1};
    }
  }
  const out=Object.values(merged).map(l=>{
    const due=addMonths(l.date, HOLD_MONTHS);
    return {...l, due, held:daysBetween(l.date,today), left:daysBetween(today,due)};
  });
  return out.sort((a,b)=> a.due.localeCompare(b.due) || a.name.localeCompare(b.name));
}
const lotLevel = left => left<0 ? "over" : (left<=WARN_DAYS ? "soon" : "ok");
const lotText  = left => left<0 ? `${-left} Tage überfällig`
                       : left===0 ? "heute fällig"
                       : `noch ${left} ${left===1?"Tag":"Tage"}`;

/** Handelstage aus der Kurshistorie (+ heute), ab dem ersten Kauf. */
function tradingDays(){
  const set = new Set();
  for(const isin in PRICES.history) for(const d in PRICES.history[isin]) if(d>=START) set.add(d);
  set.add(today);
  for(const t of TRADES) set.add(t.date);
  return [...set].sort();
}

/** Letzter bekannter Kurs <= d (Forward-Fill), in Notierungswaehrung. */
function priceAt(isin, d){
  const h = PRICES.history[isin]; if(!h) return null;
  if(h[d]!=null) return h[d];
  let best=null, bestD=null;
  for(const k in h){ if(k<=d && (bestD===null||k>bestD)){ bestD=k; best=h[k]; } }
  return best;
}
function fxAt(d){
  const h = PRICES.fx.history||{};
  if(h[d]!=null) return h[d];
  let best=null,bestD=null;
  for(const k in h){ if(k<=d && (bestD===null||k>bestD)){ bestD=k; best=h[k]; } }
  return best ?? PRICES.fx.usd_eur ?? 1;
}

/** Bestand, Einstand, realisierte Gewinne je ISIN – Durchschnittskostenmethode. */
function positionsAt(d){
  const pos = {};
  for(const t of TRADES){
    if(t.date>d) continue;
    const p = pos[t.isin] || (pos[t.isin]={isin:t.isin,name:t.name,qty:0,cost:0,fees:0,realized:0,buys:0,sells:0,nbuy:0,nsell:0,first:t.date,last:t.date});
    p.last = t.date;
    p.fees += t.fee_total||0;
    if(t.side==="BUY"){ p.qty += t.quantity; p.cost += t.amount; p.buys += t.amount; p.nbuy++; }
    else{
      const avg = p.qty>0 ? p.cost/p.qty : 0;
      p.realized += (t.amount - avg*t.quantity) - (t.fee_total||0);
      p.cost -= avg*t.quantity; p.qty -= t.quantity; p.sells += t.amount; p.nsell++;
    }
  }
  return pos;
}

/** Netto eingezahltes Kapital (Kaeufe + Gebuehren − Verkaufserloese) bis d. */
function investedAt(d){
  let v=0; for(const t of TRADES){ if(t.date<=d) v += -(t.cash_flow ?? (t.side==="BUY" ? -(t.amount+(t.fee_total||0)) : (t.amount-(t.fee_total||0)))); }
  return v;
}
function dividendsAt(d){ let v=0; for(const x of DIVS) if(x.date<=d) v += x.net_eur||0; return v; }

/** Tagesreihe: Depotwert, investiertes Kapital, Cashflow, kumulierte Dividenden. */
function buildSeries(){
  const out=[];
  for(const d of DAYS){
    if(d<START) continue;
    const pos = positionsAt(d);
    const fx = d===today ? fxNow() : fxAt(d);
    let value=0, known=true;
    for(const isin in pos){
      const p=pos[isin]; if(p.qty<=1e-9) continue;
      let px;
      if(d===today){ const q=quoteOf(isin); px = q.price ?? priceAt(isin,d); }
      else px = priceAt(isin,d);
      if(px==null){ known=false; continue; }
      const ccy = (PRICES.quotes[isin]||{}).currency || "USD";
      value += p.qty * toEur(px, ccy, fx);
    }
    out.push({d, value, invested:investedAt(d), div:dividendsAt(d), known});
  }
  // Cashflow je Tag fuer die Renditerechnung
  for(let i=0;i<out.length;i++){
    out[i].cf = out[i].invested - (i? out[i-1].invested : 0);
    out[i].dcf = out[i].div - (i? out[i-1].div : 0);
  }
  return out;
}

/** Zeitgewichtete Rendite (TWR) ueber ein Segment der Tagesreihe.
 *  startValue wird gesetzt, wenn es keinen Vortag gibt (Beginn der Strategie);
 *  ohne Angabe dient die erste Zeile als Anfangsbestand.  */
function twr(rows, startValue){
  let f=1;
  const from = startValue===undefined ? 1 : 0;
  let prev = startValue===undefined ? (rows[0] ? rows[0].value : 0) : startValue;
  for(let i=from;i<rows.length;i++){
    const cur=rows[i].value, cf=rows[i].cf||0, dv=rows[i].dcf||0;
    const base = prev + cf;
    if(base>1e-9) f *= (cur+dv)/base;
    prev = cur;
  }
  return f-1;
}
/** Geldgewichtete Rendite p.a. (XIRR, Newton-Verfahren). */
function xirr(flows){
  if(flows.length<2) return null;
  const t0 = new Date(flows[0].d+"T00:00:00").getTime();
  const yr = f => (new Date(f.d+"T00:00:00").getTime()-t0)/(365*864e5);
  const npv = r => flows.reduce((s,f)=> s + f.a/Math.pow(1+r, yr(f)), 0);
  let lo=-0.9999, hi=100;
  if(npv(lo)*npv(hi)>0) return null;
  for(let i=0;i<300;i++){ const m=(lo+hi)/2; (npv(lo)*npv(m)<=0 ? hi=m : lo=m); }
  return (lo+hi)/2;
}

function kpis(){
  const pos = positionsAt(today);
  let value=0, cost=0, realized=0, fees=0;
  for(const isin in pos){
    const p=pos[isin]; realized+=p.realized; fees+=p.fees;
    if(p.qty<=1e-9) continue;
    const q=quoteOf(isin); const px=q.price ?? priceAt(isin,today);
    value += p.qty * toEur(px, q.currency||"USD");
    cost += p.cost;
  }
  const invested = investedAt(today);
  const div = dividendsAt(today);
  const wht = DIVS.reduce((s,x)=>s+ (x.withholding_tax||0) * (x.gross_currency==="USD" ? (x.fx_rate? 1/x.fx_rate : fxNow()) : 1), 0);
  const total = value + div - invested;                 // Gesamtergebnis inkl. Gebuehren
  const unreal = value - cost;                          // ohne Gebuehren
  const days = Math.max(1,(new Date(today)-new Date(START))/864e5);
  const tw = twr(SERIES, 0);
  const cagr = days>=1 ? Math.pow(1+tw, 365/days)-1 : null;
  const flows = TRADES.map(t=>({d:t.date, a:(t.cash_flow ?? -(t.amount+(t.fee_total||0)))}))
    .concat(DIVS.map(x=>({d:x.date, a:x.net_eur||0})))
    .concat([{d:today, a:value}])
    .sort((a,b)=>a.d.localeCompare(b.d));
  const irr = xirr(flows);
  // Tagesveraenderung aus Vortagesschluss
  let dayAbs=0, dayBase=0;
  for(const isin in pos){ const p=pos[isin]; if(p.qty<=1e-9) continue;
    const q=quoteOf(isin); if(q.price==null||q.prev_close==null) continue;
    dayAbs += p.qty*toEur(q.price-q.prev_close,q.currency||"USD");
    dayBase += p.qty*toEur(q.prev_close,q.currency||"USD");
  }
  // Faelligkeiten: offene Tranchen mit Wert zum aktuellen Kurs
  const lots = openLots().map(l=>{
    const q=quoteOf(l.isin), px=q.price ?? priceAt(l.isin,today);
    const v = l.qty * toEur(px, q.currency||"USD");
    return {...l, value:v, gain:v-l.cost, gainPct: l.cost>0 ? (v-l.cost)/l.cost : null};
  });
  const dueSoon = lots.filter(l=>l.left<=WARN_DAYS);

  return {value,cost,invested,div,wht,fees,realized,total,unreal,tw,cagr,irr,days,
          totalPct: invested>0 ? total/invested : null,
          dayAbs, dayPct: dayBase>0 ? dayAbs/dayBase : null, positions:pos,
          lots, dueSoon,
          dueSoonValue: dueSoon.reduce((s,l)=>s+l.value,0)};
}

const NS="http://www.w3.org/2000/svg";
const el=(n,a={})=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
function niceTicks(min,max,n=5){
  const span=(max-min)||1, raw=span/n, mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||10*mag;
  const t=[]; for(let v=Math.floor(min/step)*step; v<=max+step*1e-9; v+=step) t.push(+v.toFixed(10));
  return t;
}

/* Auf schmalen Displays wird die viewBox kleiner gewaehlt: dadurch werden
   Schrift und Balken beim Herunterskalieren relativ groesser und bleiben lesbar. */
const isNarrow = box => (box.clientWidth || 900) < 560;

/** Liniendiagramm mit Fadenkreuz-Tooltip; series = [{key,label,color,soft}] */
function lineChart(box, rows, series, opt={}){
  const nar=isNarrow(box);
  box.innerHTML="";
  const W=nar?380:920, H=nar?(opt.h?opt.h*0.80:250):(opt.h||330),
        M=nar?{t:10,r:8,b:26,l:54}:{t:14,r:16,b:28,l:64},
        FS=nar?13:11.5;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":opt.aria||"Verlauf"});
  if(rows.length<2){
    const r=rows[0];
    box.innerHTML = r
      ? `<p class="note">Für diese Zeitachse gibt es bisher nur einen Datenpunkt
         (${r.label||dDE(r.d)}): Depotwert ${eur(r.value)}, eingesetzt ${eur(r.invested)}.
         Wähle eine feinere Einteilung – die Strategie läuft erst seit ${dDE(START)}.</p>`
      : '<p class="note">Keine Daten.</p>';
    return;
  }
  let lo=Infinity,hi=-Infinity;
  for(const r of rows) for(const s of series){ const v=r[s.key]; if(v==null)continue; lo=Math.min(lo,v); hi=Math.max(hi,v); }
  const pad=(hi-lo)*0.10 || Math.max(1,hi*0.05);
  lo=Math.max(0,lo-pad); hi=hi+pad;
  const X=i=>M.l+(W-M.l-M.r)*(rows.length===1?0.5:i/(rows.length-1));
  const Y=v=>H-M.b-(H-M.t-M.b)*((v-lo)/((hi-lo)||1));

  for(const t of niceTicks(lo,hi,nar?4:5)){
    if(t<lo-1e-9||t>hi+1e-9) continue;
    svg.appendChild(el("line",{x1:M.l,x2:W-M.r,y1:Y(t),y2:Y(t),stroke:"var(--grid)","stroke-width":1}));
    const tx=el("text",{x:M.l-7,y:Y(t)+4,"text-anchor":"end",fill:"var(--muted)","font-size":FS});
    tx.textContent=nfNum.format(t).replace(",00","")+" €"; svg.appendChild(tx);
  }
  const step=Math.max(1,Math.ceil(rows.length/(nar?4:6)));
  for(let i=0;i<rows.length;i+=step){
    const tx=el("text",{x:X(i),y:H-8,"text-anchor":"middle",fill:"var(--muted)","font-size":FS});
    tx.textContent=opt.xlabel?opt.xlabel(rows[i]):dShort(rows[i].d); svg.appendChild(tx);
  }
  svg.appendChild(el("line",{x1:M.l,x2:W-M.r,y1:H-M.b,y2:H-M.b,stroke:"var(--axis)","stroke-width":1}));

  for(const s of series){
    const pts=rows.map((r,i)=> r[s.key]==null?null:`${X(i)},${Y(r[s.key])}`).filter(Boolean);
    if(s.fill){
      svg.appendChild(el("polygon",{points:`${M.l},${H-M.b} ${pts.join(" ")} ${X(rows.length-1)},${H-M.b}`,fill:s.soft,stroke:"none"}));
    }
    svg.appendChild(el("polyline",{points:pts.join(" "),fill:"none",stroke:s.color,"stroke-width":2,
      "stroke-linejoin":"round","stroke-linecap":"round","stroke-dasharray":s.dash||"none"}));
    const li=rows.length-1;
    if(rows[li][s.key]!=null){
      svg.appendChild(el("circle",{cx:X(li),cy:Y(rows[li][s.key]),r:4.5,fill:s.color,stroke:"var(--surface-1)","stroke-width":2}));
    }
  }
  const cross=el("line",{x1:0,x2:0,y1:M.t,y2:H-M.b,stroke:"var(--axis)","stroke-width":1,opacity:0});
  svg.appendChild(cross);
  const marks=series.map(s=>{const c=el("circle",{r:5,fill:s.color,stroke:"var(--surface-1)","stroke-width":2,opacity:0});svg.appendChild(c);return c;});
  box.appendChild(svg);

  const tip=document.createElement("div"); tip.className="tip"; box.appendChild(tip);
  function move(ev){
    const rect=svg.getBoundingClientRect();
    const cx=((ev.touches?ev.touches[0].clientX:ev.clientX)-rect.left)/rect.width*W;
    let i=Math.round((cx-M.l)/((W-M.l-M.r)/Math.max(1,rows.length-1)));
    i=Math.max(0,Math.min(rows.length-1,i));
    const r=rows[i];
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i)); cross.setAttribute("opacity",1);
    series.forEach((s,k)=>{ if(r[s.key]==null){marks[k].setAttribute("opacity",0);return;}
      marks[k].setAttribute("cx",X(i)); marks[k].setAttribute("cy",Y(r[s.key])); marks[k].setAttribute("opacity",1); });
    tip.innerHTML=`<div class="t-d">${opt.tipdate?opt.tipdate(r):dDE(r.d)}</div>`+
      series.map(s=>`<div class="t-r"><span><i class="swatch" style="background:${s.color}"></i>${s.label}</span><b>${eur(r[s.key])}</b></div>`).join("")+
      (opt.tipextra?opt.tipextra(r):"");
    tip.style.opacity=1;
    const px=X(i)/W*rect.width;
    tip.style.left=Math.max(0,Math.min(rect.width-tip.offsetWidth, px-tip.offsetWidth/2))+"px";
    tip.style.top="6px";
  }
  const hide=()=>{tip.style.opacity=0;cross.setAttribute("opacity",0);marks.forEach(m=>m.setAttribute("opacity",0));};
  svg.addEventListener("mousemove",move); svg.addEventListener("mouseleave",hide);
  svg.addEventListener("touchstart",move,{passive:true}); svg.addEventListener("touchmove",move,{passive:true});
  svg.addEventListener("touchend",hide);
}

/** Horizontale Balken (eine Serie, Magnitude) mit Direktbeschriftung. */
function hBars(box, items, opt={}){

    svg.appendChild(el("rect",{x,y,width:w,height:bh,rx:4,fill:it.color||"var(--s1)"}));

    v.textContent = nar && it.textShort ? it.textShort : it.text; svg.appendChild(v);
    if(opt.diverging) svg.appendChild(el("line",{x1:zero,x2:zero,y1:y-3,y2:y+bh+3,stroke:"var(--axis)","stroke-width":1}));

}

/** Gruppierte Vertikalbalken (z.B. Käufe/Verkäufe je Monat). */
function groupBars(box, cats, series, opt={}){
  const nar=isNarrow(box);

  box.appendChild(svg);
}

/* ------------------------------------------------------ Aggregation Zeitraum */
function isoWeek(d){
  const t=new Date(d+"T00:00:00"); const day=(t.getDay()+6)%7;
  t.setDate(t.getDate()-day+3); const first=new Date(t.getFullYear(),0,4);
  const w=1+Math.round(((t-first)/864e5-3+((first.getDay()+6)%7))/7);
  return `${t.getFullYear()}-KW${String(w).padStart(2,"0")}`;
}
const periodKey=(d,g)=> g==="Tag"?d : g==="Woche"?isoWeek(d) : g==="Monat"?d.slice(0,7) : d.slice(0,4);
const periodLabel=(k,g)=> g==="Tag"?dShort(k) : g==="Woche"?k.replace("-KW"," KW") : g==="Monat"?
  new Date(k+"-01T00:00:00").toLocaleDateString("de-DE",{month:"short",year:"2-digit"}) : k;

/** Reihe auf Periodenende verdichten. */
function resample(rows,g){
  if(g==="Tag") return rows;
  const out=[],seen=new Map();
  for(const r of rows) seen.set(periodKey(r.d,g), r);
  for(const [k,r] of seen) out.push({...r, key:k, label:periodLabel(k,g)});
  return out;
}
/** Renditetabelle je Periode (TWR, Einzahlung, Wertänderung). */
function periodStats(g){
  const groups=new Map();
  SERIES.forEach((r,i)=>{ const k=periodKey(r.d,g); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(i); });
  const out=[];
  let prevIdx=null;
  for(const [k,idx] of groups){
    const first=idx[0], last=idx[idx.length-1];
    const rows=SERIES.slice(prevIdx==null?first:prevIdx, last+1);
    const inflow=SERIES.slice(first,last+1).reduce((s,r)=>s+r.cf,0);
    const divs=SERIES.slice(first,last+1).reduce((s,r)=>s+r.dcf,0);
    const startV=prevIdx==null?0:SERIES[prevIdx].value;
    out.push({key:k,label:periodLabel(k,g),start:SERIES[first].d,end:SERIES[last].d,
      startValue:startV, endValue:SERIES[last].value, inflow, divs,
      change:SERIES[last].value-startV-inflow, ret:twr(rows, prevIdx==null?0:undefined)});
    prevIdx=last;
  }
  return out.reverse();
}

    const b=document.createElement("button");
    b.textContent = id==="pruefung" && issues ? `${label} (${issues})` : label;
    b.setAttribute("role","tab"); b.setAttribute("aria-selected", id===activeTab);
    b.onclick=()=>{activeTab=id; document.querySelectorAll("section.tab").forEach(s=>s.classList.toggle("active", s.id==="tab-"+id));
      renderTabs(); renderAll(); window.scrollTo({top:0,behavior:"smooth"});};
    nav.appendChild(b);
  }
}

function kpiCard(lbl,val,delta,klass){
  return `<div class="kpi"><div class="lbl">${lbl}</div><div class="val ${klass||""}">${val}</div>`+
         (delta?`<div class="delta">${delta}</div>`:"")+`</div>`;
}

function rangeCut(rows){
  if(chartRange==="Max") return rows;
  const m={"1M":1,"3M":3,"6M":6,"1J":12}[chartRange];
  const cut=new Date(); cut.setMonth(cut.getMonth()-m);
  const c=iso(cut);
  const f=rows.filter(r=>r.d>=c);
  return f.length>1?f:rows;
}
function drawMain(){
  const box=document.getElementById("mainchart"); if(!box) return;
  const rows=resample(rangeCut(SERIES),gran);
  lineChart(box,rows,[
    {key:"value",label:"Depotwert",color:"var(--s1)",soft:"var(--s1-soft)",fill:true},
    {key:"invested",label:"Eingesetztes Kapital",color:"var(--s2)",dash:"5 4"}
  ],{aria:"Depotwert gegen eingesetztes Kapital",
     xlabel:r=>gran==="Tag"?dShort(r.d):(r.label||dShort(r.d)),
     tipdate:r=>gran==="Tag"?dDE(r.d):`${r.label||""} (Stand ${dDE(r.d)})`,
     tipextra:r=>{const g=r.value+r.div-r.invested;
       return `<div class="t-r" style="border-top:1px solid var(--grid);margin-top:5px;padding-top:5px">
       <span>Ergebnis</span><b class="${cls(g)}">${eurS(g)}</b></div>`;}});
}

    ${sorted.length?sorted.map(i=>`<div class="issue ${i.level}">
        <div class="ico">${ico[i.level]||"?"}</div>
        <div><div class="txt">${esc(i.message)}</div>
        <div class="files">${i.files.map(esc).join(", ")}</div></div></div>`).join("")
      :`<div class="issue ok"><div class="ico">✓</div><div class="txt">Alle Belege sind schlüssig – keine Auffälligkeiten.</div></div>`}
  </div>
  <div class="card">
    <h2>Datenstand</h2>
    <div class="tblwrap"><table><tbody>
      <tr><td>Belege eingelesen</td><td class="num">${TX.documents}</td></tr>
      <tr><td>Abrechnungen (Käufe/Verkäufe)</td><td class="num">${TRADES.length}</td></tr>
      <tr><td>Dividendenabrechnungen</td><td class="num">${DIVS.length}</td></tr>
      <tr><td>Kosteninformationen</td><td class="num">${TX.cost_infos.length}</td></tr>
      <tr><td>Belege zuletzt gelesen</td><td class="num">${new Date(TX.generated_at).toLocaleString("de-DE")}</td></tr>
      <tr><td>Kurs-Snapshot erstellt</td><td class="num">${new Date(PRICES.updated_at).toLocaleString("de-DE")}</td></tr>
    </tbody></table></div>
    <p class="note">Neue PDFs einfach in den Ordner legen und <code>Dashboard aktualisieren.bat</code> starten –
      Käufe, Verkäufe und Dividenden werden selbstständig erkannt und geprüft.</p>
  </div>`;
}

function renderAll(){
  const k=kpis();
  document.getElementById("subtitle").textContent =
    `Trade Republic · ${Object.values(k.positions).filter(p=>p.qty>1e-9).length} Positionen · seit ${dDE(START)}`;
  if(activeTab==="uebersicht") renderUebersicht(k);
  if(activeTab==="positionen") renderPositionen(k);
  if(activeTab==="verlauf") renderVerlauf();
  if(activeTab==="transaktionen") renderTransaktionen();
  if(activeTab==="kosten") renderKosten(k);
  if(activeTab==="pruefung") renderPruefung();
}

/* ------------------------------------------------- Selbstaktualisierung ---
   Beim Bauen wird eine Kennung eingesetzt und dieselbe Kennung in die winzige
   Datei version.json geschrieben. Die Seite fragt diese Datei mit einem
   Zufallsanhang ab - dadurch kann der Browser sie nicht aus dem Zwischen-
   speicher beantworten. Steht dort eine neuere Kennung, laedt sich die Seite
   unter neuer Adresse selbst nach. So bekommt das Handy neue Staende ohne
   Zutun, auch wenn es die alte Fassung gespeichert hat. */
const BUILD = "20260801-103804";
async function checkForUpdate(){
  if(!location.protocol.startsWith("http")) return;       // lokal nicht noetig
  try{
    const r = await fetch(`version.json?t=${Date.now()}`, {cache:"no-store"});
    if(!r.ok) return;
    const v = await r.json();
    if(!v.built || v.built === BUILD) return;
    if(sessionStorage.getItem("dash-reload") === v.built) return;  // keine Schleife
    sessionStorage.setItem("dash-reload", v.built);
    location.replace(location.pathname + "?v=" + encodeURIComponent(v.built));
  }catch(e){}
}

/* ------------------------------------------------------------- Live-Kurse */
/* Yahoo liefert keine CORS-Header, deshalb zuerst direkt (klappt bei
   frankfurter.dev) und danach ueber zwei kostenlose CORS-Proxys. */
const PROXIES=[
  u=>u,
  u=>`https://corsproxy.io/?url=${encodeURIComponent(u)}`,
  u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
];
async function fetchJson(url,timeout=9000){
  for(const p of PROXIES){
    const ctl=new AbortController();
    const timer=setTimeout(()=>ctl.abort(),timeout);
    try{
      const r=await fetch(p(url),{cache:"no-store",signal:ctl.signal});
      if(r.ok) return await r.json();
    }catch(e){}
    finally{ clearTimeout(timer); }
  }
  return null;
}
function setPriceState(mode,txt){
  document.getElementById("pricedot").className="dot"+(mode?` ${mode}`:"");
  document.getElementById("pricetxt").textContent=txt;
}
async function refreshPrices(){
  const btn=document.getElementById("refresh");
  btn.disabled=true; setPriceState("", "Kurse werden geladen…");
  try{
    const symbols=[], map={};
    for(const isin in PRICES.quotes){ const s=PRICES.quotes[isin].symbol; if(s){symbols.push(s); map[s]=isin;} }
    let ok=false;
    if(symbols.length){
      const spark=await fetchJson(`https://query1.finance.yahoo.com/v7/finance/spark?symbols=${symbols.join(",")}&range=1d&interval=1d`);
      const res=spark && spark.spark && spark.spark.result;
      if(res){
        const q={};
        for(const r of res){
          const m=(r.response&&r.response[0]&&r.response[0].meta)||null;
          if(!m||m.regularMarketPrice==null) continue;
          const isin=map[r.symbol]; if(!isin) continue;
          q[isin]={price:m.regularMarketPrice, prev:m.chartPreviousClose, t:m.regularMarketTime};
        }
        if(Object.keys(q).length){ liveQuotes=q; ok=true; }
      }
    }
    const fx=await fetchJson("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR");
    if(fx && fx.rates && fx.rates.EUR) liveFx=fx.rates.EUR;
    if(ok){
      liveStamp=Date.now();
      try{ localStorage.setItem(LS_KEY, JSON.stringify({stamp:liveStamp,quotes:liveQuotes,fx:liveFx})); }catch(e){}
    }
  }catch(e){}
  finally{
    btn.disabled=false;
    showPriceState();
    renderAll();
  }
}
function showPriceState(){
  if(liveStamp){
    const age=(Date.now()-liveStamp)/60000;
    const t=new Date(liveStamp).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    setPriceState(age<90?"live":"stale", `Kurse live · ${t}`);
  }else{
    const t=new Date(PRICES.updated_at).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    setPriceState("stale", `Kurse aus Snapshot · ${t}`);
  }
}

/* ---------------------------------------------------------------- Start */
document.getElementById("refresh").onclick=()=>refreshPrices();
document.getElementById("theme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next=cur==="dark"?"light":cur==="light"?"":"dark";
  if(next) document.documentElement.setAttribute("data-theme",next);
  else document.documentElement.removeAttribute("data-theme");
  try{localStorage.setItem("dash-theme",next);}catch(e){}
  renderAll();
};
try{const th=localStorage.getItem("dash-theme"); if(th) document.documentElement.setAttribute("data-theme",th);}catch(e){}

function init(payload){
  DATA=payload; TX=DATA.transactions; PRICES=DATA.prices;
  TRADES = TX.trades.slice().sort((a,b)=> (a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  DIVS   = TX.dividends.slice().sort((a,b)=>a.date.localeCompare(b.date));
  START  = TRADES.length ? TRADES[0].date : today;
  DAYS   = tradingDays();
  SERIES = buildSeries();
  renderTabs();
  showPriceState();
  renderAll();
  refreshPrices();
  checkForUpdate();
  setInterval(refreshPrices, 5*60*1000);   // solange die Seite offen ist
  setInterval(checkForUpdate, 5*60*1000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) checkForUpdate(); });
  window.addEventListener("resize",()=>{ clearTimeout(window.__rz); window.__rz=setTimeout(renderAll,180); });
}

init(JSON.parse(document.getElementById("payload").textContent));
